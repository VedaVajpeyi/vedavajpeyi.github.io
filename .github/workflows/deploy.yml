name: Deploy static site to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify shared chrome (nav/footer) is in sync
        run: node scripts/sync-chrome.mjs

      - name: Check for broken internal links
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 &
          SERVER_PID=$!
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8080/index.html > /dev/null && break
            sleep 0.5
          done
          FILES=$(find . -name "*.html" -not -path "*/experiments/*" -not -path "*/references/*" -not -path "*/.claude/*" -not -name "googlef*" | sed 's|^\./||' | sed 's|^|http://127.0.0.1:8080/|')
          npx --yes linkinator@6 $FILES --skip "^https?://(?!127\.0\.0\.1)"
          EXIT_CODE=$?
          kill $SERVER_PID
          exit $EXIT_CODE

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
